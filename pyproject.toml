[project]
name = "hw-online-store"
version = "0.1.0"
description = "Интернет магазин"
authors = [
    {name = "Dmitrii Goldyrev",email = "dharani@mail.ru"}
]
requires-python = ">=3.14"
dependencies = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]


[tool.flake8]
max-line-length = 119

[tool.black]
line-length = 119
target-version = ['py314']

[tool.isort]
profile = "black"
line_length = 119

[tool.mypy]
python_version = "3.14"
disallow_untyped_defs = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
